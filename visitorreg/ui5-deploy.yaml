# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: zmp.visitorreg
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        ignoreCertErrors: true # Server uses a self-signed certificate
        verbose: true # Log the backend's error details; remove once deployment works
        target:
          url: https://s4hanaabap.fortun8tech.com:44300
          client: '100'
        app:
          name: ZMP_VISITORREG
          description: Visitor Registration App
          package: ZVMS
          transport: A4HK900181
        exclude:
          - /test/
          - /localService/
